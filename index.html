<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management Dashboard</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <h2 id="title">USER MANAGEMENT DASHBOARD</h2>
    <br>
    <form id="userForm">
    <input type="text" id="name" placeholder="Enter Name" required><br>
    <input type="email" id="email" placeholder="Enter Email" required><br>
    <input type="text" id="city" placeholder="Enter City" required><br>
    <input type="number" id="phone" placeholder="Enter Phone" required><br>
    <button type="submit" id="addbtn">Add User</button>
    </form>
     <br>
     <br>
    <input type="text" id="search" placeholder="Enter User Name" required>
    <button id="searchbtn">search</button>
    <br>
    <p id="loading">Loading....</p>
    <br>
    <p id="users"></p>
    <br>
    <script type="module" src="js/main.js"></script>
</body>
</html>
